[workspace]
resolver = "2"
members = [
    "resources",
    "game"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["??? <???>"]
description = "???"
license-file = "LICENSE"
repository = "https://github.com/emmabritton/?"
readme = "README.md"
keywords = ["games", "pixels", "retro", "gba"]
categories = ["games"]
publish = false

[workspace.dependencies]
agb = "0.23.1"
agb_eb_ext = {path = "../agb_ext"}
gba_agb_font_eb = "0.6.0"
gba_agb_font_renderer = "0.6.0"
gba_agb_font_loader = "0.6.0"

arrayvec = { version = "0.7.6", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"]}

[profile.dev]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false